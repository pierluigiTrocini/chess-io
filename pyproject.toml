[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-io"
dynamic = ["version"]
description = "Revisione delle partite a scacchi nel terminale: Stockfish, mosse classificate, commenti e riassunto in italiano"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "chess>=1.11,<2",
    "httpx>=0.27,<1",
    "textual>=8,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
bundle = ["pyinstaller>=6,<7"]

[project.scripts]
chess-io = "chess_io.cli:main"

[tool.setuptools.dynamic]
version = { attr = "chess_io.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# openings.sqlite c'è solo se generato prima del build (packaging/wheel.sh); altrimenti lo scarica `chess-io setup`
chess_io = ["data/*.toml", "data/*.sqlite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
